<!DOCTYPE html>
<html lang="en-US">
<head>
    <script src="/gtag.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8" />
    <title>hoverSlider.js</title>

    <link rel="stylesheet" href="hoverSlider.css" />
    <script src="hoverSlider.js"></script>

    <style type="text/css">
        body {
            --bg: #fff;
            --bdrs: 4px;

            display: flex;
            flex-direction: column;
            min-height: 100svh;
            margin: 0 2em;
            background: var(--bg);
            justify-content: center;
            align-items: center;
            text-decoration-skip-ink: none;
        }
        h1 {
            line-height: 1;
            margin-bottom: -0.25em;
        }

        .npm {
            --gap: .5em;

            display: inline-flex;
            align-items: baseline;
            gap: var(--gap);
            border-radius: calc(var(--bdrs) + 1px);
            background: color-mix(in oklch, currentColor 9%, transparent);
            border: 1px solid transparent;
            padding-left: var(--gap);

            .copy {
                align-self: center;
                font: inherit;
                height: 1em;
                width: calc(1em + 2 * var(--gap));
                padding: 0;
                border: none;
                border-radius: var(--bdrs);
                background: no-repeat center / 16px url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2216%22%20height%3D%2216%22%20fill%3D%22none%22%3E%3Cpath%20stroke%3D%22%23000%22%20d%3D%22M5.5%203a.5.5%200%200%201%20.5-.5h5.5c.5523%200%201%20.4477%201%201V10a.5.5%200%200%201-.5.5%22%20opacity%3D%22.4%22%2F%3E%3Cpath%20stroke%3D%22%23000%22%20d%3D%22M3.5%205.5c0-.5523.4477-1%201-1h5c.5523%200%201%20.4477%201%201v6c0%20.5523-.4477%201-1%201h-5c-.5523%200-1-.4477-1-1z%22%2F%3E%3C%2Fsvg%3E");
                background-color: var(--bg);
                cursor: pointer;
    
                &[data-copied] {
                    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20fill%3D%22none%22%20stroke%3D%22%23063%22%20viewBox%3D%220%200%2016%2016%22%3E%3Cpath%20d%3D%22m4%208%203.5%203.5L14%205%22%2F%3E%3C%2Fsvg%3E");
                    cursor: default;
                }
            }
        }

        .radiogroup {
            display: inline-flex;
            border-radius: calc(var(--bdrs) + 1px);
            background: color-mix(in oklch, currentColor 9%, transparent);
            border: 1px solid transparent;
            gap: 1px;
            margin: 0.125em 1px;

            input[type="radio"] {
                display: none;
            }
            input[type="radio"] + label {
                white-space: nowrap;
                display: inline-block;
                padding: 0 0.1em;
                border-radius: var(--bdrs);
                opacity: .75;
                user-select: none;
                cursor: pointer;
            }
            input[type="radio"]:checked + label {
                background: var(--bg);
                opacity: 1;
                cursor: default;
                user-select: auto;
            }
        }

    </style>
</head>
<body>
    <h1>hoverSlider</h1>
    <p style="text-align: center;">
        <a href="https://github.com/keymasterr/hoverSlider">GitHub</a> ·
        <a href="joke.html">pure CSS desktop-only version</a>
        
        <br>

        <a href="https://www.npmjs.com/package/hoverslider">npm</a>: 
        <span class="npm">
            <code>npm i hoverslider</code>
            <button type="button" class="copy" aria-label="Copy install command"></button>
        </span>
    </p>
    <p>Lightweight vanilla JS slider: move your cursor or finger across to flip through images</p>

    <div class="hover_slider" style="flex-shrink: 0; max-width: 100%;">
        <img src="example-1@2x.png" />
        <img src="example-2.png" />
        <img src="example-3.png" />
        <img src="example-4.png" />
        <img src="example-5.png" />
        <img src="example-6.png" />
        <img src="example-7.png" />
        <img src="example-8.png" />
        <img src="example-9.png" />
        <img src="example-10.png" />
        <img src="example-11.png" />
        <img src="example-12.png" />
    </div>

    <p><code id="params"></code></p>

    <p>Full options, sizing rules and the JS API are in the <a href="https://github.com/keymasterr/hoverSlider#configuration">README</a>.</p>

    <script>
        const copyBtn = document.querySelector(".copy");
        const copyCmd = document.querySelector(".npm code");
        let copiedTimer;

        copyBtn.addEventListener("click", async () => {
            const text = copyCmd.textContent.trim();
            try {
                await navigator.clipboard.writeText(text);
            } catch {
                // clipboard API needs a secure context; fall back to a scratch textarea
                const ta = document.createElement("textarea");
                ta.value = text;
                document.body.append(ta);
                ta.select();
                document.execCommand("copy");
                ta.remove();
            }
            copyBtn.dataset.copied = "";
            clearTimeout(copiedTimer);
            copiedTimer = setTimeout(() => {
                delete copyBtn.dataset.copied;
            }, 1500);
        });
    </script>

    <script>
        const slider = document.querySelector(".hover_slider");
        let handle;

        function reinit() {
            const active = handle?.active ?? 0;
            slider._hoverSliderDestroy();
            [handle] = hoverSlider(slider);
            handle.setActive(active);
        }

        // `null` means the attribute is absent.
        const params = [
            { label: "data-ind",
                dataset: "ind",
                options: ["dots", "nums", "none", null],
                checked: "dots"
            },
            { label: "data-border",
                dataset: "border",
                options: ["none", null],
                checked: null
            },
            { label: "data-touch-relative",
                dataset: "touchRelative",
                options: ["true", "false"],
                checked: "false",
                reinit: true
            },
            { label: "data-touch-loop",
                dataset: "touchLoop",
                options: ["true", "false"],
                checked: "false",
                reinit: true
            },
        ];

        const paramsEl = document.querySelector('#params');

        function applyParam(param, value) {
            if (value === null) delete slider.dataset[param.dataset];
            else slider.dataset[param.dataset] = value;
            if (param.reinit && slider._hoverSliderDestroy) reinit();
        }

        params.forEach(param => {
            const groupId = `param-${param.dataset}`;
            const line = document.createElement('div');

            const groupEl = document.createElement('span');
            groupEl.className = 'radiogroup';
            groupEl.id = groupId;

            param.options.forEach((value, i) => {
                const id = `${groupId}-${i}`;
                const input = document.createElement('input');
                input.type = 'radio';
                input.name = groupId;
                input.id = id;
                if (value === param.checked) input.checked = true;

                const labelEl = document.createElement('label');
                labelEl.htmlFor = id;
                labelEl.textContent = value === null ? '\u00a0\u00a0—\u00a0\u00a0' : `"${value}"`;

                input.addEventListener('click', () => applyParam(param, value));
                groupEl.append(input, labelEl);
            });

            line.append(`${param.label}=`, groupEl);
            paramsEl.append(line);

            applyParam(param, param.checked);
        });

        [handle] = hoverSlider(slider);
    </script>
</body>
</html>
